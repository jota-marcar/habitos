# Weekly dependency review: new security advisories and Expo SDK patches.
# It does not depend on open Pull Requests; if it fails, GitHub sends an email.
name: Weekly review

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  # Allows running it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Security advisories
        run: npm run audit-deps
      # Runs even if the audit fails, to see both results.
      - name: Expo SDK patches
        if: ${{ !cancelled() }}
        run: npx --yes expo-doctor
