# CI for every Pull Request: checks formatting, lint, types and tests.
# "Verify" is the required check to merge into main.
# "Audit" is informational: a new security advisory must not block an unrelated PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to an exact commit: a change in them does not run without review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Metro resolves imports that Jest mocks or never reaches: a broken one would only fail
      # when publishing. The bundle is left out of the repository.
      - name: Bundle the app
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/bundle"

  # Cloud schema (supabase/): Row Level Security, constraints and alignment with the local
  # schema, on a local Supabase database (ADR-0015). Also the synchronization from end to end,
  # against its API (ADR-0018), and the Edge Functions, served by its Edge Runtime (ADR-0019).
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Exact version: a new CLI does not run without review.
          version: 3.1.0
      # The ports of Supabase (supabase/config.toml) are inside the range Linux hands out to
      # outgoing connections, so one of them could be taken when its container starts.
      - name: Reserve the ports of Supabase
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      # Postgres, with the migrations of supabase/migrations applied, and the services the app
      # talks to: the API (Kong and PostgREST), Auth (GoTrue) and the Edge Runtime, which serves
      # supabase/functions. The rest are left out.
      - run: >-
          supabase start
          --exclude studio,imgproxy,storage-api,realtime,logflare,vector,postgres-meta,supavisor
      # The address and the keys of the local API, for the tests of the synchronization and of
      # the Edge Functions. They are the fixed values of every local Supabase, not secrets.
      - name: Local API settings
        run: >-
          supabase status -o env
          | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY|SERVICE_ROLE_KEY|SECRET_KEY)='
          | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/'
          >> "$GITHUB_ENV"
      - name: pgTAP tests
        run: supabase test db
      - name: Alignment with the local schema, synchronization and Edge Functions
        run: npm run test:schema

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit-deps
